<!doctype html>
<html lang="en">
  <head>
    <title>My Intro</title>
    <style>
      body {
        background-color: aquamarine;
      }
      table {
        align-items: center;
        justify-content: center;
        margin-left: 600px;
      }
      .singup {
        align-items: center;
        justify-content: center;
        margin-left: 600px;
      }
      .submit {
        width: 100px;
        height: 50px;
        background-color: blueviolet;
        color: whitesmoke;
      }
    </style>
  </head>
  <body>
    <h1 class="singup">Sign Up form</h1>
    <form>
      <table>
        <tr>
          <td><h3 class="username">Username</h3></td>
          <td>
            <input
              type="text"
              name="Username"
              id="username"
              placeholder="Enter Username"
            />
          </td>
        </tr>
        <tr>
          <td><h3>Password</h3></td>
          <td>
            <input
              type="password"
              name="password"
              id="Password"
              placeholder="Enter Password"
            />
          </td>
        </tr>
        <tr>
          <td><h3>Enter Address</h3></td>
          <td>
            <textarea
              name="address"
              id="address"
              cols="30"
              rows="10"
            ></textarea>
          </td>
        </tr>
        <tr>
          <td><h3>Gender</h3></td>
          <td>
            Male <input type="radio" name="gender" id="gender" value="male" />
          </td>
          <td>
            Female
            <input type="radio" name="gender" id="gender" value="female" />
          </td>
        </tr>
        <tr>
          <td><h3>Select City</h3></td>
          <td>
            <select name="city" id="city">
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Rajkot">Rajkot</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><h3>Select Profile photo</h3></td>
          <td><input type="file" name="profile" id="profile" /></td>
        </tr>
        <td><input type="submit" value="Submit" class="submit" /></td>
      </table>
    </form>
  </body>
</html>
